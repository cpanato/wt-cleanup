version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X sigs.k8s.io/release-utils/version.gitVersion={{ .Version }}
      - -X sigs.k8s.io/release-utils/version.gitCommit={{ .FullCommit }}
      - -X sigs.k8s.io/release-utils/version.gitTreeState={{ .GitTreeState }}
      - -X sigs.k8s.io/release-utils/version.buildDate={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

# Keyless signing with the release workflow's OIDC identity. Runs before the
# release is published, so the bundles ship with it (releases are immutable).
signs:
  - cmd: cosign
    artifacts: all
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}
    output: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - name: wt-cleanup
    repository:
      owner: cpanato
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/cpanato/wt-cleanup
    description: Clean up git worktrees whose work has landed
    license: Apache-2.0
    skip_upload: auto # don't publish prereleases
    hooks:
      post:
        # The binaries aren't notarized; clear quarantine so macOS runs them.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/wt-cleanup"]
          end
